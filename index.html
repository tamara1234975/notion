<!DOCTYPE html>
<!-- original: https://codepen.io/boudra/pen/raErwP -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario</title>

  <style>
    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      background-color: #fff;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100%;
    }

    button::-moz-focus-inner {
      border: 0;
      padding: 0;
    }

    #calendari {
      margin: 0 auto;
      font-size: 14px;
      position: relative; /* importante para que no se descoloque */
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      box-shadow: 0px 1px 3px rgba(0,0,0,0.2);
      background-color: #fff;
      position: relative; /* mejor que absolute dentro de embeds */
    }

    td, th {
      text-align: center;
      background-color: #fff;
    }

    th { padding: 10px; }

    tr:first-child th {
      font-size: 22px;
      font-weight: bold;
      border-left: none;
      border-top: none;
    }

    td:last-child, th:last-child { border-right: none; }

    th {
      border-top: 1px solid rgba(0,0,0,0.1);
      border-right: 1px solid rgba(0,0,0,0.1);
      background-color: #DB9A9F; /* rosado fuerte */
      color: #fff;
      text-shadow: 0px -1px 0px rgba(0,0,0,0.2);
      font-weight: normal;
    }

    th .any {
      font-size: 10px;
      font-weight: normal;
      display: block;
      text-shadow: none;
      color: rgba(0,0,0,0.4);
    }

    tr:nth-child(2) th { padding: 5px; }

    td {
      padding: 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    td > span {
      color: #555;
      padding: 10px;
      display: block;
      border: 2px solid transparent;
      transition: border 0.3s ease;
    }

    td:nth-child(even) > span { background-color: rgba(0,0,0,0.02); }

    td:last-child > span,
    td:nth-child(6) > span {
      color: #DB9A9F;
    }

    /* "Hoy" */
    td.avui > span {
      font-weight: bold;
      background-color: #DB9A9F;
      color: #fff;
      border: 2px solid rgba(0,0,0,0.1);
    }

    td.fora > span { opacity: 0.2; }

    td > span:hover {
      background: #ECCBCD; /* rosado suave */
      color: #fff;
    }

    .boto-next, .boto-prev {
      background: rgba(0,0,0,0.1);
      color: #fff;
      font-family: inherit;
      border: none;
      font-size: 18px;
      font-weight: bold;
      text-shadow: inherit;
      padding: 2px 10px 5px 10px;
      line-height: 1px;
      height: 30px;
      width: 30px;
      vertical-align: middle;
      border-radius: 100%;
      position: absolute;
      top: 15px;
    }

    .boto-next { right: 10px; padding-left: 13px; }
    .boto-prev { left: 10px; padding-right: 13px; }

    .boto-next:hover,
    .boto-prev:hover {
      background: rgba(0,0,0,0.2);
    }

    button:hover { cursor: pointer; }
    button:focus { outline: none; }
  </style>
</head>

<body>
  <div class="wrapper">
    <div id="calendari"></div>
  </div>

  <script>
    var mesos = [
      'Enero','Febrero','Marzo','Abril','Mayo','Junio',
      'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'
    ];

    var dies_abr = ['Do','Lu','Ma','Mi','Ju','Vi','Sa'];

    Number.prototype.pad = function(num) {
      var str = '';
      for (var i = 0; i < (num - this.toString().length); i++) str += '0';
      return str += this.toString();
    }

    function calendari(widget, data) {
      // "Hoy" real (NO cambia cuando navegas meses)
      var today = new Date();

      var original = widget.getElementsByClassName('actiu')[0];

      if (typeof original === 'undefined') {
        original = document.createElement('table');
        original.setAttribute('data-actual',
          data.getFullYear() + '/' +
          data.getMonth().pad(2) + '/' +
          data.getDate().pad(2)
        );
        widget.appendChild(original);
      }

      var diff = data - new Date(original.getAttribute('data-actual'));
      diff = new Date(diff).getMonth();

      var e = document.createElement('table');
      e.className = diff === 0 ? 'amagat-esquerra' : 'amagat-dreta';
      e.innerHTML = '';
      widget.appendChild(e);

      e.setAttribute('data-actual',
        data.getFullYear() + '/' +
        data.getMonth().pad(2) + '/' +
        data.getDate().pad(2)
      );

      var fila = document.createElement('tr');
      var titol = document.createElement('th');
      titol.setAttribute('colspan', 7);

      var boto_prev = document.createElement('button');
      boto_prev.className = 'boto-prev';
      boto_prev.innerHTML = '◂';

      var boto_next = document.createElement('button');
      boto_next.className = 'boto-next';
      boto_next.innerHTML = '▸';

      titol.appendChild(boto_prev);
      titol.appendChild(document.createElement('span')).innerHTML =
        mesos[data.getMonth()] + '<span class="any">' + data.getFullYear() + '</span>';
      titol.appendChild(boto_next);

      boto_prev.onclick = function() {
        data.setMonth(data.getMonth() - 1);
        calendari(widget, data);
      };

      boto_next.onclick = function() {
        data.setMonth(data.getMonth() + 1);
        calendari(widget, data);
      };

      fila.appendChild(titol);
      e.appendChild(fila);

      // Encabezado días (Lun..Sáb + Dom al final) => semana inicia lunes
      fila = document.createElement('tr');
      for (var i = 1; i < 7; i++) {
        fila.innerHTML += '<th>' + dies_abr[i] + '</th>';
      }
      fila.innerHTML += '<th>' + dies_abr[0] + '</th>';
      e.appendChild(fila);

      // Obtiene el día que acabó el mes anterior
      var inici_mes = new Date(data.getFullYear(), data.getMonth(), -1).getDay();

      var actual = new Date(
        data.getFullYear(),
        data.getMonth(),
        -inici_mes
      );

      // 6 semanas para cubrir todas las posibilidades
      for (var s = 0; s < 6; s++) {
        var fila = document.createElement('tr');

        for (var d = 1; d < 8; d++) {
          var cela = document.createElement('td');
          var span = document.createElement('span');

          cela.appendChild(span);
          span.innerHTML = actual.getDate();

          // Días fuera del mes actual (gris)
          if (actual.getMonth() !== data.getMonth()) {
            cela.className = 'fora';
          }

          // Marcar SOLO el "hoy" real (no el día 11 arrastrado)
          if (
            today.getDate() === actual.getDate() &&
            today.getMonth() === actual.getMonth() &&
            today.getFullYear() === actual.getFullYear()
          ) {
            cela.className = 'avui';
          }

          actual.setDate(actual.getDate() + 1);
          fila.appendChild(cela);
        }

        e.appendChild(fila);
      }

      setTimeout(function() {
        e.className = 'actiu';
        original.className += diff === 0 ? ' amagat-dreta' : ' amagat-esquerra';
      }, 20);

      original.className = 'inactiu';

      setTimeout(function() {
        var inactius = document.getElementsByClassName('inactiu');
        for (var i = 0; i < inactius.length; i++) widget.removeChild(inactius[i]);
      }, 1000);
    }

    calendari(document.getElementById('calendari'), new Date());
  </script>
</body>
</html>
